<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图测试</title>
    <style>
        body { margin: 0; padding: 20px; }
        #map-container { width: 800px; height: 600px; border: 1px solid #ccc; }
    </style>
    <script src="js/libs/echarts.min.js"></script>
</head>
<body>
    <h1>地图加载测试</h1>
    <div id="map-container"></div>
    
    <script>
        console.log('页面加载开始');
        
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成');
            
            const container = document.getElementById('map-container');
            console.log('地图容器:', container);
            console.log('容器尺寸:', container.offsetWidth, 'x', container.offsetHeight);
            
            // 初始化echarts
            const chart = echarts.init(container);
            console.log('echarts实例创建成功:', chart);
            
            // 加载地图数据
            fetch('data/常州区县网格地图.json')
                .then(response => {
                    console.log('响应状态:', response.status);
                    return response.json();
                })
                .then(geoJson => {
                    console.log('地图数据加载成功:', geoJson.type, geoJson.features.length, '个要素');
                    
                    // 注册地图
                    echarts.registerMap('常州', geoJson);
                    console.log('地图注册成功');
                    
                    // 设置地图选项
                    const option = {
                        tooltip: {
                            trigger: 'item'
                        },
                        series: [{
                            name: '测试',
                            type: 'map',
                            map: '常州',
                            roam: true,
                            zoom: 1.2,
                            center: [119.72, 31.62],
                            label: {
                                show: true
                            },
                            data: []
                        }]
                    };
                    
                    chart.setOption(option);
                    console.log('地图选项设置成功');
                })
                .catch(error => {
                    console.error('地图加载失败:', error);
                });
        });
    </script>
</body>
</html>
