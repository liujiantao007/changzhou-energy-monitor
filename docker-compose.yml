services:
  energy-monitor:
    image: changzhou-energy-monitor:latest
    container_name: energy-monitor-prod
    restart: always

    # 1. 使用 host 网络，让容器直通宿主机的网络层（解决 3220 数据库超时问题）
    network_mode: "host"

    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=10.38.78.217
      - DB_PORT=3220
      - DB_USER=liujiantao
      - DB_PASSWORD=Liujt!@#
      - DB_NAME=energy_management_2026

    # 2. 挂载你刚才修改完 65080 端口的 nginx.conf 文件
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s