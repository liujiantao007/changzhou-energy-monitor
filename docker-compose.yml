services:
  energy-monitor:
    image: changzhou-energy-monitor:latest
    container_name: energy-monitor-prod
    restart: always

    # 端口映射
    ports:
      - "65080:80"    # 前端页面（外部访问 65080）
      - "5000:5000"   # 后端 API

    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=10.38.78.217
      - DB_PORT=3220
      - DB_USER=liujiantao
      - DB_PASSWORD=Liujt!@#
      - DB_NAME=energy_management_2026

    # 挂载 nginx.conf 文件
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s