<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>地图独立测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a1a2e; }
        h2 { color: #fff; text-align: center; padding: 20px; }
        #test-map {
            width: 800px;
            height: 600px;
            margin: 0 auto;
            border: 2px solid #ff0;
        }
        #log {
            width: 800px;
            margin: 20px auto;
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h2>ECharts 地图独立测试</h2>
    <div id="test-map"></div>
    <div id="log"></div>

    <script src="js/libs/echarts.min.js"></script>
    <script>
        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerHTML += '[' + new Date().toLocaleTimeString() + '] ' + msg + '<br>';
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        log('=== 开始独立测试 ===');
        log('ECharts 版本: ' + echarts.version);

        const container = document.getElementById('test-map');
        log('容器尺寸: ' + container.offsetWidth + 'x' + container.offsetHeight);

        const mapChart = echarts.init(container);
        log('ECharts 实例创建成功');

        mapChart.showLoading({ text: '加载地图数据...' });
        log('显示加载状态');

        fetch('data/常州区县网格地图.json')
            .then(response => {
                log('JSON 响应状态: ' + response.status);
                log('Content-Type: ' + response.headers.get('content-type'));
                return response.text();
            })
            .then(text => {
                log('原始响应长度: ' + text.length);
                log('前200字符: ' + text.substring(0, 200));
                return JSON.parse(text);
            })
            .then(geoJson => {
                log('JSON 解析成功');
                log('type: ' + geoJson.type);
                log('features 数量: ' + geoJson.features.length);
                
                geoJson.features.forEach((f, i) => {
                    log('  Feature ' + i + ': ' + f.properties.name + 
                        ' level=' + f.properties.level + 
                        ' geometry.type=' + f.geometry.type);
                });

                mapChart.hideLoading();
                log('开始注册地图...');
                
                try {
                    echarts.registerMap('test-changzhou', geoJson);
                    log('地图注册成功');
                } catch(e) {
                    log('地图注册失败: ' + e.message);
                    return;
                }

                const data = geoJson.features.map(f => ({
                    name: f.properties.name,
                    value: Math.floor(Math.random() * 1000)
                }));
                log('构建数据: ' + JSON.stringify(data));

                const option = {
                    backgroundColor: '#1a2a4e',
                    title: { text: '常州地图测试', left: 'center', top: 10, textStyle: { color: '#fff', fontSize: 16 } },
                    tooltip: { trigger: 'item', formatter: '{b}: {c} kWh' },
                    visualMap: { min: 0, max: 1000, orient: 'vertical', left: 'left', bottom: 'bottom', text: ['高','低'], inRange: { color: ['#e0f0ff', '#0066cc'] } },
                    series: [{
                        type: 'map',
                        map: 'test-changzhou',
                        roam: true,
                        zoom: 5,
                        center: [120.02, 31.76],
                        aspectScale: 1.0,
                        data: data,
                        label: { show: true, color: '#fff', fontSize: 12 },
                        emphasis: { label: { show: true }, itemStyle: { areaColor: '#ffd466' } },
                        itemStyle: { areaColor: '#4a8ad4', borderColor: '#ff6600', borderWidth: 3 }
                    }]
                };

                mapChart.setOption(option);
                log('地图选项设置成功');
                log('地图尺寸: ' + mapChart.getWidth() + 'x' + mapChart.getHeight());
                log('=== 测试完成 ===');
            })
            .catch(error => {
                mapChart.hideLoading();
                log('加载失败: ' + error.message);
                console.error(error);
            });
    </script>
</body>
</html>
