<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>地图测试-内嵌数据</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#fff;font-family:sans-serif;padding:20px}
  h2{text-align:center;margin-bottom:10px}
  #log{background:#000;color:#0f0;font-family:monospace;font-size:11px;padding:10px;margin:10px auto;width:800px;max-height:200px;overflow-y:auto;white-space:pre-wrap}
  #test-map{width:800px;height:500px;margin:10px auto;border:3px solid red;background:#003}
</style>
</head>
<body>
<h2>地图测试 - 完全自包含</h2>
<div id="test-map"></div>
<div id="log"></div>

<script src="js/libs/echarts.min.js"></script>
<script>
const L = document.getElementById('log');
function log(m){L.textContent+='> '+m+'\n';L.scrollTop=L.scrollHeight;console.log(m)}

log('开始测试');
log('echarts 版本: ' + (typeof echarts!=='undefined' ? echarts.version : 'NOT LOADED'));

const geoJson = {
  "type": "FeatureCollection",
  "features": [
    {"type":"Feature","properties":{"name":"天宁区"},"geometry":{"type":"Polygon","coordinates":[[[120.00,31.78],[120.06,31.78],[120.06,31.84],[120.00,31.84],[120.00,31.78]]]}},
    {"type":"Feature","properties":{"name":"钟楼区"},"geometry":{"type":"Polygon","coordinates":[[[119.88,31.78],[120.00,31.78],[120.00,31.84],[119.88,31.84],[119.88,31.78]]]}},
    {"type":"Feature","properties":{"name":"新北区"},"geometry":{"type":"Polygon","coordinates":[[[119.94,31.84],[120.06,31.84],[120.06,31.90],[119.94,31.90],[119.94,31.84]]]}},
    {"type":"Feature","properties":{"name":"金坛区"},"geometry":{"type":"Polygon","coordinates":[[[119.88,31.70],[119.96,31.70],[119.96,31.78],[119.88,31.78],[119.88,31.70]]]}},
    {"type":"Feature","properties":{"name":"溧阳市"},"geometry":{"type":"Polygon","coordinates":[[[119.88,31.62],[120.08,31.62],[120.08,31.70],[119.88,31.70],[119.88,31.62]]]}}
  ]
};

log('内嵌 GeoJSON 定义完成，features: ' + geoJson.features.length);

const container = document.getElementById('test-map');
log('容器: ' + container.offsetWidth + 'x' + container.offsetHeight);

try {
  const mc = echarts.init(container);
  log('实例创建成功: ' + (mc ? 'yes' : 'no'));
  
  try {
    echarts.registerMap('cz', geoJson);
    log('registerMap 成功');
  } catch(e) {
    log('registerMap 失败: ' + e.message);
  }

  const mapData = geoJson.features.map(f=>({name:f.properties.name,value:500+Math.floor(Math.random()*500)}));
  log('数据: ' + JSON.stringify(mapData.map(d=>d.name+':'+d.value)));

  const opt = {
    backgroundColor: '#1a2a4e',
    series: [{
      type: 'map',
      map: 'cz',
      roam: false,
      data: mapData,
      label: {show:true,color:'#fff',fontSize:14},
      emphasis: {label:{show:true,fontWeight:'bold'},itemStyle:{areaColor:'#ffd466'}},
      itemStyle: {areaColor:'#4a8ad4',borderColor:'#fff',borderWidth:2},
      zoom: 1.2,
      center: [119.98, 31.75],
      aspectScale: 0.85
    }]
  };

  mc.setOption(opt);
  log('setOption 完成');
  log('渲染尺寸: ' + mc.getWidth() + 'x' + mc.getHeight());
  
  const seriesModel = mc.getModel().getSeriesByIndex(0);
  log('series 存在: ' + (seriesModel ? 'yes' : 'no'));
  if(seriesModel) {
    const d = seriesModel.getData();
    log('series data 数量: ' + d.count());
  }
  
  log('=== 测试完成 ===');
} catch(e) {
  log('错误: ' + e.message);
  log('堆栈: ' + e.stack);
}
</script>
</body>
</html>
