<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>地图最小测试</title>
<style>
  body{background:#222;margin:20px}
  #box{width:700px;height:450px;border:3px solid lime;margin:10px auto;background:#113}
  #info{margin:10px auto;width:700px;background:#000;color:#0f0;font:11px monospace;padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="box"></div>
<div id="info">加载中...</div>

<script>document.getElementById('info').textContent='ECharts脚本加载中...';</script>
<script src="js/libs/echarts.min.js"></script>
<script>
var I=document.getElementById('info');
function L(m){I.textContent+=m+'\n';console.log(m)}

L('ECharts: '+(typeof echarts!=='undefined'?echarts.version:'FAILED'));
if(typeof echarts==='undefined'){L('STOP - 库未加载');throw new Error()}

L('init...');
var c=echarts.init(document.getElementById('box'));
L('实例: '+(c?'OK':'FAIL'));

// 最简单的矩形地图
var gj={type:'FeatureCollection',features:[
  {type:'Feature',properties:{name:'A'},geometry:{type:'Polygon',coordinates:[[[0,0],[100,0],[100,100],[0,100],[0,0]]]}}
]};

L('注册地图...');
try{echarts.registerMap('test',gj);L('注册OK')}catch(e){L('注册失败:'+e.message)}

L('设选项...');
try{
  c.setOption({
    series:[{
      type:'map',map:'test',
      data:[{name:'A',value:100}],
      label:{show:true,color:'#fff'}
    }]
  });
  L('设置OK, 尺寸:'+c.getWidth()+'x'+c.getHeight());
  L('DONE');
}catch(e){L('错误:'+e.message+'\n'+e.stack)}
</script>
</body>
</html>
